<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Fenmoor Roleplay - Loading Screen</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; }

  body{
    font-family: Georgia, "Times New Roman", serif;
    position:relative;
    width:100vw; height:100vh;
  }

  .bg{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 30%, #241a12 0%, #100b07 55%, #050302 100%);
  }

  .mist{
    position:absolute; inset:-10%;
    background:
      radial-gradient(ellipse 40% 30% at 20% 85%, rgba(80,60,35,0.35), transparent 70%),
      radial-gradient(ellipse 35% 25% at 80% 90%, rgba(80,60,35,0.3), transparent 70%),
      radial-gradient(ellipse 50% 20% at 50% 100%, rgba(60,45,25,0.4), transparent 70%);
    animation: driftMist 18s ease-in-out infinite alternate;
  }
  @keyframes driftMist{
    0%{ transform:translate(-2%,0%); }
    100%{ transform:translate(2%,-1.5%); }
  }

  .stars{
    position:absolute; inset:0 0 45% 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, #fff, transparent),
      radial-gradient(1px 1px at 25% 40%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 40% 10%, #fff, transparent),
      radial-gradient(1px 1px at 60% 30%, #fff, transparent),
      radial-gradient(1px 1px at 75% 8%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 88% 22%, #fff, transparent),
      radial-gradient(1px 1px at 92% 45%, #fff, transparent),
      radial-gradient(1px 1px at 5% 50%, #fff, transparent);
    opacity:0.5;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ 0%{opacity:0.35;} 100%{opacity:0.6;} }

  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
  }

  .ember{
    position:absolute; bottom:0;
    width:4px; height:4px; border-radius:50%;
    background:#e8933a;
    box-shadow:0 0 8px 2px rgba(232,147,58,0.8);
    opacity:0;
    animation: floatEmber linear infinite;
  }
  @keyframes floatEmber{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:0.9; }
    90%{ opacity:0.5; }
    100%{ transform:translate(30px,-100vh); opacity:0; }
  }

  .center{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    z-index:5;
    width:100%;
  }

  .crest{
    width:150px; height:150px; border-radius:50%;
    margin-bottom:22px;
    box-shadow:0 0 50px rgba(232,147,58,0.4), 0 10px 30px rgba(0,0,0,0.8);
    animation: pulseGlow 3.2s ease-in-out infinite;
  }
  .crest img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 40px rgba(232,147,58,0.35), 0 10px 30px rgba(0,0,0,0.8); }
    50%{ box-shadow:0 0 65px rgba(232,147,58,0.55), 0 10px 30px rgba(0,0,0,0.8); }
  }

  .title{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:700; font-size:48px;
    letter-spacing:6px;
    color:#e8c874;
    background:linear-gradient(180deg, #f5e3ae, #c9a24b 55%, #8a6b2e);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 4px 10px rgba(0,0,0,0.8);
  }
  .subtitle{
    font-family: Georgia, serif; font-weight:400; font-style:italic; font-size:15px;
    letter-spacing:4px; text-transform:uppercase; color:#9c8968;
    margin-top:10px;
  }

  .tip-box{
    position:absolute; bottom:14%; left:50%; transform:translateX(-50%);
    text-align:center; z-index:5;
    font-family:Georgia, serif; font-style:italic; font-size:16px;
    color:rgba(232,217,184,0.75);
    width:80%; max-width:560px;
    text-shadow:0 2px 6px rgba(0,0,0,0.8);
  }
  .tip-box .tip-label{
    display:block; font-family:Georgia, serif; font-style:normal; font-weight:700; font-size:11px;
    letter-spacing:3px; text-transform:uppercase; color:#e8933a; margin-bottom:8px;
    opacity:0.85;
  }

  .progress-wrap{
    position:absolute; bottom:5%; left:50%; transform:translateX(-50%);
    width:70%; max-width:420px; z-index:5;
  }
  .progress-track{
    height:6px; border-radius:3px;
    background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,162,75,0.4);
    overflow:hidden;
  }
  .progress-fill{
    height:100%; width:64%;
    background:linear-gradient(90deg, #8a6b2e, #e8933a, #f0d38a);
    box-shadow:0 0 10px rgba(232,147,58,0.6);
  }
  .progress-label{
    text-align:center; margin-top:10px;
    font-family:Georgia, serif; font-size:11px; letter-spacing:2px;
    color:#9c8968; text-transform:uppercase;
  }
</style>
</head>
